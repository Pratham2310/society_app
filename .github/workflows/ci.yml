name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Integration tests exercise real writes, and several flows use
      # transactions — which require a replica set, not a standalone
      # mongod. A single-node replica set is enough.
      - name: Start MongoDB (replica set)
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: rs0

      - name: Install dependencies
        run: npm ci

      # The check that would have caught every startup bug in this repo:
      # if app.js cannot be required, nothing else is worth running.
      - name: App loads
        run: npm run smoke
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: ci-secret-at-least-32-characters-long
          CLOUDINARY_NAME: ci
          CLOUDINARY_KEY: ci
          CLOUDINARY_SECRET: ci

      - name: Tests
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ci
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/ci
          JWT_SECRET: ci-secret-at-least-32-characters-long
          CLOUDINARY_NAME: ci
          CLOUDINARY_KEY: ci
          CLOUDINARY_SECRET: ci

      # A real gate as of Phase 3: the no-undef backlog is cleared, so
      # any new undefined identifier fails the build instead of waiting
      # to surface as a ReferenceError in production.
      - name: Lint
        run: npm run lint

      # The spec is generated from the route table. If it is stale, the
      # clients are generating types from an API that no longer exists.
      - name: OpenAPI spec is current
        run: npm run openapi:check

  # =====================================================================
  # THE CLIENTS
  #
  # Until now only the backend was gated, so a client could break and
  # merge anyway — both were being checked by hand, which is to say not
  # reliably. Separate job because it needs no database and can run
  # alongside.
  # =====================================================================
  clients:
    runs-on: ubuntu-latest

    strategy:
      # One failing client should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - name: admin portal
            dir: frontend/adminportal
            # tsc -b then vite build, so this typechecks and compiles.
            check: npm run build
          - name: app
            dir: frontend/app
            check: npm run typecheck

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.dir }}

      - name: Check
        run: ${{ matrix.check }}
        working-directory: ${{ matrix.dir }}

  # =====================================================================
  # THE APP BUNDLES
  #
  # Metro resolving and compiling every route is the strongest check
  # available without a device — it catches a bad import or a missing
  # native module, which a typecheck does not. It takes a couple of
  # minutes, so it is its own job rather than slowing the one above.
  # =====================================================================
  app-bundle:
    runs-on: ubuntu-latest
    needs: clients

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend/app

      - name: Dependencies match the SDK
        run: npx expo-doctor
        working-directory: frontend/app

      - name: Bundle
        run: npm run bundle
        working-directory: frontend/app
